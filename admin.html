<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Authentication | Ai Mart X</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/security.js') }}"></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
  <div class="card" style="width: 360px;">
    <h2 style="margin-bottom: 16px; text-align: center;">👑 Admin Gate</h2>
    <form method="POST">
      <input type="text" name="username" placeholder="Admin ID" required style="width: 100%; padding: 10px; margin-bottom: 12px; background: #000; border: 1px solid var(--border-card); color: #fff; border-radius: 8px;">
      <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 10px; margin-bottom: 16px; background: #000; border: 1px solid var(--border-card); color: #fff; border-radius: 8px;">
      <button class="btn" style="width: 100%;">Authorize</button>
    </form>
  </div>
</body>
</html>
