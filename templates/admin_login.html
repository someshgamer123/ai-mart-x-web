<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Gateway | Ai Mart X</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      background: #090d16;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 36px;
      width: 380px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    input {
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 16px;
      background: #0b0f19;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }
    .btn {
      width: 100%;
      padding: 11px;
      background: #4f46e5;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #4338ca; }
    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 6px;">Administrator Gateway</h2>
    <p style="color: #9ca3af; font-size: 0.85rem; margin-bottom: 20px;">Ai Mart X Standalone Engine</p>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/admin/login">
      <label style="display: block; margin-bottom: 6px; font-size: 0.82rem; color: #9ca3af;">Username</label>
      <input type="text" name="username" placeholder="admin" required autofocus>
      
      <label style="display: block; margin-bottom: 6px; font-size: 0.82rem; color: #9ca3af;">Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
      
      <button class="btn" type="submit">Verify & Access</button>
    </form>
  </div>
</body>
</html>
